<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmileCraft Dental Care | Your Trusted Family Dental Clinic</title>
    <meta name="description" content="Providing gentle, advanced, and affordable dental care for children and adults with modern technology, painless procedures, and experienced dentists." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <meta property="og:title" content="SmileCraft Dental Care - Advanced & Gentle Dental Clinic" />

  <body class="bg-[#F8FAFC] text-[#0F172A] antialiased selection:bg-sky-500 selection:text-white font-sans">
    <script type="text/javascript">
      // GitHub Pages SPA path reconstruction
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
